<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)" rx="12" />
  
  <!-- Header Stamp -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="40" y="45" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="16">📸 DR-NET LOGISTICS — BUKTI CABUTAN KABEL FO</text>
  <circle cx="550" cy="40" r="8" fill="#10b981" />
  
  <!-- Fiber Cable Coil Illustration -->
  <circle cx="300" cy="170" r="70" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="8 4" />
  <circle cx="300" cy="170" r="50" fill="none" stroke="#3b82f6" stroke-width="6" />
  <circle cx="300" cy="170" r="30" fill="#334155" />
  
  <!-- Connectors SC/UPC Blue -->
  <rect x="360" y="140" width="40" height="16" rx="3" fill="#2563eb" stroke="#93c5fd" stroke-width="2" />
  <rect x="400" y="144" width="12" height="8" rx="1" fill="#e2e8f0" />
  <rect x="200" y="180" width="40" height="16" rx="3" fill="#2563eb" stroke="#93c5fd" stroke-width="2" />
  <rect x="188" y="184" width="12" height="8" rx="1" fill="#e2e8f0" />
  
  <text x="300" y="174" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">FO DROP CORE</text>
  
  <!-- Barcode Tag -->
  <rect x="380" y="80" width="180" height="50" rx="6" fill="#f8fafc" />
