  <text x="390" y="118" fill="#16a34a" font-family="monospace" font-weight="bold" font-size="11">LEN: 15 METER (INTACT)</text>
  
  <!-- Footer Info Card -->
  <rect x="20" y="280" width="560" height="100" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="40" y="310" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">STATUS INSPEKSI: KONDISI BAIK (READY RE-USE)</text>
